name: Publicar sincronização segura
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicar-banco-e-funcoes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4
      - name: Extrair arquivos da sincronização
        run: unzip -oq supabase-bundle.zip
      - name: Preparar Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Vincular ao projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: bflltzcvnqfilxpezfqt
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Aplicar estrutura do banco
        run: |
          encoded_password="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          database_url="postgresql://postgres.bflltzcvnqfilxpezfqt:${encoded_password}@aws-1-sa-east-1.pooler.supabase.com:5432/postgres"
          supabase db push --db-url "$database_url" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: bflltzcvnqfilxpezfqt
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Definir segredos das funções
        run: supabase secrets set "PIN_PEPPER=$PIN_PEPPER" "BOOTSTRAP_TOKEN=$BOOTSTRAP_TOKEN" "PUBLIC_APP_URL=https://felipeleans.github.io/pequenos-construtores/"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: bflltzcvnqfilxpezfqt
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
      - name: Publicar funções de segurança
        run: |
          supabase functions deploy setup-team --no-verify-jwt
          supabase functions deploy list-members --no-verify-jwt
          supabase functions deploy login-pin --no-verify-jwt
          supabase functions deploy add-instructor --no-verify-jwt
          supabase functions deploy manage-instructor --no-verify-jwt
          supabase functions deploy request-pin-reset --no-verify-jwt
          supabase functions deploy reset-pin --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: bflltzcvnqfilxpezfqt
